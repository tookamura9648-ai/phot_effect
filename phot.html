<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>魔法の合成フォトエディタ</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* 編集エリア */
        #container { position: relative; width: 95vw; height: 70vh; margin-top: 10px; border: 2px solid #444; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #000; }
        canvas { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* UIエリア */
        #ui { width: 100%; background: rgba(255, 255, 255, 0.95); color: #333; padding: 15px; border-radius: 20px 20px 0 0; position: fixed; bottom: 0; box-sizing: border-box; }
        .control-group { margin-bottom: 10px; }
        label { font-size: 11px; font-weight: bold; display: block; margin-bottom: 3px; }
        input[type="range"] { width: 100%; }
        
        .file-inputs { display: flex; gap: 10px; margin-bottom: 10px; }
        .file-inputs div { flex: 1; }
        
        .btn-container { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        #saveBtn { background: #ff4757; color: white; font-size: 16px; }
    </style>
</head>
<body>

    <div id="container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <div id="ui">
        <div class="file-inputs">
            <div>
                <label>1. 背景写真（あなたの手など）</label>
                <input type="file" id="bgInput" accept="image/*" style="font-size: 10px;">
            </div>
            <div>
                <label>2. 重ねる画像（龍など）</label>
                <input type="file" id="fgInput" accept="image/*" style="font-size: 10px;">
            </div>
        </div>

        <div class="control-group">
            <label>大きさ・位置・回転</label>
            <input type="range" id="sizeSlider" min="0.1" max="2.0" step="0.01" value="0.5">
            <input type="range" id="posXSlider" min="-0.5" max="1.5" step="0.01" value="0.5">
            <input type="range" id="posYSlider" min="-0.5" max="1.5" step="0.01" value="0.5">
            <input type="range" id="rotSlider" min="0" max="360" step="1" value="0">
        </div>

        <div class="btn-container">
            <button id="saveBtn">📷 合成写真を保存してSNSへ！</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const bgInput = document.getElementById('bgInput');
        const fgInput = document.getElementById('fgInput');
        
        const sliders = ['sizeSlider', 'posXSlider', 'posYSlider', 'rotSlider'].map(id => document.getElementById(id));

        let bgImg = null;
        let fgImg = null;

        // 画像読み込み処理
        function handleFile(input, callback) {
            input.onchange = (e) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => { callback(img); draw(); };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            };
        }

        handleFile(bgInput, (img) => {
            bgImg = img;
            // 背景のサイズに合わせてキャンバスの解像度を設定
            canvas.width = img.width;
            canvas.height = img.height;
        });
        handleFile(fgInput, (img) => { fgImg = img; });

        sliders.forEach(s => s.oninput = draw);

        function draw() {
            if (!bgImg) return;

            // 1. 背景を描画
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImg, 0, 0);

            if (fgImg) {
                const s = parseFloat(sliders[0].value);
                const x = parseFloat(sliders[1].value) * canvas.width;
                const y = parseFloat(sliders[2].value) * canvas.height;
                const r = parseFloat(sliders[3].value) * Math.PI / 180;

                const fw = fgImg.width * s;
                const fh = fgImg.height * s;

                // 2. 重ねる画像を回転・移動して描画
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(r);
                ctx.drawImage(fgImg, -fw / 2, -fh / 2, fw, fh);
                ctx.restore();
            }
        }

        // 保存処理（今度は確実に保存されます！）
        document.getElementById('saveBtn').onclick = () => {
            if (!bgImg) { alert("まずは背景写真を選んでね！"); return; }
            const link = document.createElement('a');
            link.download = 'Magic_Photo_' + Date.now() + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        };
    </script>
</body>
</html>
